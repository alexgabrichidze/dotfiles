# Autostart configuration

# Bar and wallpaper
exec-once = waybar
exec-once = hyprpaper

# Notifications
exec-once = mako

# Clipboard history watcher
exec-once = wl-paste --watch cliphist store

# Polkit
exec-once = hyprpolkitagent

# Secret Service for apps that store login tokens, including Bitwarden.
# The systemd socket starts gnome-keyring on Hyprland but does not claim
# org.freedesktop.secrets reliably after reboot, so replace it in-session.
exec-once = sh -c 'sleep 2; gnome-keyring-daemon -r -d'
